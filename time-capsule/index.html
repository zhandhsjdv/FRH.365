<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时光胶囊 · Time Capsule</title>
<style>
  :root{
    --bg:#f4f6fc; --card:#ffffff; --primary:#4a5bd6; --primary-dark:#3b4cc0;
    --text:#253047; --muted:#7b849a; --line:#e6e9f4; --ok:#1a9d59;
    --danger:#d9534f; --soft:#eef1fb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"Microsoft YaHei UI","PingFang SC","Helvetica Neue",Arial,sans-serif;}
  .topbar{background:linear-gradient(120deg,#4a5bd6,#7a6bd8);color:#fff;padding:22px 0 26px;
          box-shadow:0 6px 20px rgba(74,91,214,.18)}
  .wrap{max-width:1020px;margin:0 auto;padding:0 22px}
  .topbar h1{margin:0;font-size:24px;letter-spacing:1px}
  .topbar p{margin:6px 0 0;opacity:.85;font-size:13px}
  .layout{max-width:1020px;margin:-14px auto 40px;padding:0 22px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 20px;
       cursor:pointer;font-size:14px;font-weight:bold;color:var(--muted)}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff;
              box-shadow:0 4px 12px rgba(74,91,214,.25)}
  .card{background:var(--card);border-radius:14px;padding:24px;box-shadow:0 4px 18px rgba(35,48,90,.07)}
  label{font-size:13px;font-weight:bold;color:#4b556e;display:block;margin:14px 0 7px}
  input[type=text],input[type=datetime-local],textarea{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px;
    font-size:14px;font-family:inherit;background:#fbfcff;color:var(--text);outline:none}
  input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(74,91,214,.1)}
  textarea{resize:vertical;min-height:170px;line-height:1.7}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .preset{background:var(--soft);border:1px solid var(--line);color:var(--primary);
          border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer}
  .preset:hover{background:#e2e7fb}
  .btn{background:var(--primary);color:#fff;border:none;border-radius:9px;padding:11px 20px;
       font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--primary-dark)}
  .btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
  .btn.ghost:hover{background:var(--soft)}
  .btn.small{padding:7px 13px;font-size:12px}
  .btn.danger{background:#fff;color:var(--danger);border:1px solid #f0c7c5}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .mt{margin-top:20px}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  .item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;
        transition:.18s;box-shadow:0 3px 12px rgba(35,48,90,.05)}
  .item:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(35,48,90,.12)}
  .item h3{margin:0 0 8px;font-size:16px}
  .badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:bold}
  .badge.lock{background:#eef1fb;color:var(--primary)}
  .badge.open{background:#e4f7ed;color:var(--ok)}
  .muted{color:var(--muted);font-size:12px}
  .hidden{display:none!important}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .detail-head h2{margin:0 0 6px;font-size:21px}
  .status{font-weight:bold;font-size:14px;padding:8px 14px;border-radius:9px}
  .status.lock{background:var(--soft);color:var(--primary)}
  .status.open{background:#e4f7ed;color:var(--ok)}
  .stage{position:relative;margin-top:16px;border:1px solid var(--line);border-radius:11px;
         min-height:230px;background:#fbfcff;overflow:hidden}
  .content{padding:16px 18px;white-space:pre-wrap;line-height:1.8;font-size:14px}
  .entry{border-bottom:1px dashed var(--line);padding:10px 0}
  .entry:last-child{border-bottom:none}
  .entry .when{color:var(--muted);font-size:12px;margin-bottom:4px}
  .overlay{position:absolute;inset:0;background:linear-gradient(135deg,#eef1fb,#f7f8fd);
           display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .overlay .icon{font-size:44px;margin-bottom:10px}
  .overlay .big{font-size:17px;font-weight:bold;color:var(--primary)}
  .overlay .cd{font-size:26px;font-weight:bold;color:#3b4cc0;margin:12px 0 6px;font-variant-numeric:tabular-nums}
  .addbox{margin-top:14px;display:flex;gap:9px}
  .addbox input{flex:1}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
         background:#253047;color:#fff;padding:12px 22px;border-radius:30px;font-size:14px;
         opacity:0;pointer-events:none;transition:.3s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:98;overflow:hidden}
  .confetti span{position:absolute;top:-40px;font-size:24px;animation:fall 2.8s ease-in forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
  .tip{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.7}
  .empty{text-align:center;color:var(--muted);padding:50px 0}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <h1>⏳ 时光胶囊</h1>
    <p>把想说的话交给时间 · 密封期间只可添加、不可查看 · 到时自动开启</p>
  </div>
</div>

<div class="layout">
  <div class="tabs">
    <button class="tab active" id="tabCreate">封存新胶囊</button>
    <button class="tab" id="tabList">我的胶囊</button>
  </div>

  <!-- 创建页 -->
  <section id="viewCreate" class="card">
    <label>胶囊名称</label>
    <input type="text" id="title" placeholder="例如：写给三年后的自己" value="写给未来的自己">

    <label>开启时间</label>
    <input type="datetime-local" id="unlockTime" step="1">
    <div class="presets">
      <button class="preset" data-sec="10">+10 秒（演示）</button>
      <button class="preset" data-min="1">+1 分钟</button>
      <button class="preset" data-hour="1">+1 小时</button>
      <button class="preset" data-day="1">+1 天</button>
      <button class="preset" data-day="7">+7 天</button>
      <button class="preset" data-day="30">+30 天</button>
    </div>

    <label>写下此刻想说的话</label>
    <textarea id="firstText" placeholder="此刻的心情、愿望、给未来的一句话……"></textarea>

    <div class="row mt">
      <button class="btn" id="createBtn">💾 封存胶囊</button>
      <span class="muted">封存后自动加入「我的胶囊」，可随时继续添加内容</span>
    </div>
  </section>

  <!-- 列表页 -->
  <section id="viewList" class="card hidden">
    <div class="detail-head">
      <h2>我的胶囊</h2>
      <div class="row">
        <button class="btn ghost small" id="importBtn">📥 导入胶囊文件</button>
        <input type="file" id="importFile" accept=".capsule,.json" class="hidden">
      </div>
    </div>
    <div class="list" id="capsuleList" style="margin-top:16px"></div>
    <div class="empty hidden" id="emptyHint">还没有胶囊，先去「封存新胶囊」创建一个吧 ✨</div>
  </section>

  <!-- 详情页 -->
  <section id="viewDetail" class="card hidden">
    <div class="detail-head">
      <div>
        <h2 id="detailTitle"></h2>
        <div class="muted" id="detailMeta"></div>
      </div>
      <div class="row">
        <button class="btn ghost small" id="backBtn">← 返回列表</button>
        <button class="btn ghost small" id="exportBtn">📤 导出文件</button>
        <button class="btn danger small" id="deleteBtn">删除</button>
      </div>
    </div>

    <div class="status lock" id="detailStatus" style="margin-top:16px"></div>

    <div class="stage">
      <div class="content" id="contentArea"></div>
      <div class="overlay" id="lockedOverlay">
        <div class="icon">🔒</div>
        <div class="big" id="lockedTitle"></div>
        <div class="cd" id="countdown"></div>
        <div class="muted">密封期间可以继续添加内容，但无法查看已有内容</div>
      </div>
    </div>

    <div class="addbox">
      <input type="text" id="addText" placeholder="继续追加一条记忆（回车或点击按钮封存）">
      <button class="btn" id="addBtn">封存这条内容</button>
    </div>
    <div class="tip">
      提示：胶囊数据加密保存在本机浏览器中，并保存在导出的 .capsule 文件里。<br>
      「自动开启」由打开胶囊的程序按本机时间判断，修改系统时间会影响判断结果。
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- 基础工具 ---------------- */
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = bytes => btoa(String.fromCharCode(...bytes));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const escapeHtml = s => s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmt = d => {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
};
const toDate = s => new Date(s.replace(' ', 'T'));
const metaString = c => `${c.unlock_at}|${c.created_at}|${c.title}`;

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------------- 加密（AES-GCM，浏览器原生） ---------------- */
async function importKey(jwk){
  return crypto.subtle.importKey('jwk', jwk, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
}
async function encryptText(key, text, aad){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt(
    {name:'AES-GCM', iv, additionalData: enc.encode(aad)}, key, enc.encode(text));
  return {time: fmt(new Date()), iv: b64(iv), ct: b64(new Uint8Array(ct))};
}
async function decryptText(key, item, aad){
  const buf = await crypto.subtle.decrypt(
    {name:'AES-GCM', iv: unb64(item.iv), additionalData: enc.encode(aad)}, key, unb64(item.ct));
  return dec.decode(buf);
}

/* ---------------- 数据 ---------------- */
let capsules = [];
try { capsules = JSON.parse(localStorage.getItem('timeCapsules') || '[]'); } catch(e){ capsules = []; }
const persist = () => localStorage.setItem('timeCapsules', JSON.stringify(capsules));
let current = null, unlockedShown = false;

function isUnlocked(c){ return toDate(c.unlock_at) <= new Date(); }
function countdownText(c){
  let s = Math.max(0, Math.floor((toDate(c.unlock_at) - new Date()) / 1000));
  const d = Math.floor(s/86400); s %= 86400;
  const h = Math.floor(s/3600); s %= 3600;
  const m = Math.floor(s/60); s %= 60;
  const p = n => String(n).padStart(2,'0');
  return d ? `${d} 天 ${p(h)}:${p(m)}:${p(s)}` : `${p(h)}:${p(m)}:${p(s)}`;
}

/* ---------------- 页面切换 ---------------- */
function show(which){
  ['Create','List','Detail'].forEach(n => $('view'+n).classList.add('hidden'));
  $('view'+which).classList.remove('hidden');
  ['Create','List'].forEach(n => $('tab'+n).classList.remove('active'));
  const tab = which === 'Detail' ? 'List' : which;
  $('tab'+tab).classList.add('active');
}
$('tabCreate').onclick = () => show('Create');
$('tabList').onclick = () => { renderList(); show('List'); };
$('backBtn').onclick = () => { current = null; renderList(); show('List'); };

/* ---------------- 创建 ---------------- */
function setPreset(fn){
  const d = new Date(); fn(d);
  const p = n => String(n).padStart(2,'0');
  $('unlockTime').value = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
document.querySelectorAll('.preset').forEach(b => b.onclick = () => {
  if (b.dataset.sec) setPreset(d => d.setSeconds(d.getSeconds() + +b.dataset.sec));
  else if (b.dataset.min) setPreset(d => d.setMinutes(d.getMinutes() + +b.dataset.min));
  else if (b.dataset.hour) setPreset(d => d.setHours(d.getHours() + +b.dataset.hour));
  else if (b.dataset.day) setPreset(d => d.setDate(d.getDate() + +b.dataset.day));
});

$('createBtn').onclick = async () => {
  const title = $('title').value.trim() || '未命名胶囊';
  if (!$('unlockTime').value){ toast('请先选择开启时间'); return; }
  const when = new Date($('unlockTime').value);
  if (when <= new Date()){ toast('开启时间必须晚于现在'); return; }
  try {
    const key = await crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
    const jwk = await crypto.subtle.exportKey('jwk', key);
    const c = {format:'TimeCapsule/1', id:uid(), title,
               created_at:fmt(new Date()), unlock_at:fmt(when), key:jwk, entries:[]};
    const text = $('firstText').value.trim();
    if (text) c.entries.push(await encryptText(key, text, metaString(c)));
    capsules.push(c); persist();
    $('firstText').value = '';
    toast('胶囊已封存 ⏳');
    openCapsule(c);
  } catch(e){ toast('创建失败：' + e.message); }
};

/* ---------------- 列表 ---------------- */
function renderList(){
  const box = $('capsuleList'); box.innerHTML = '';
  $('emptyHint').classList.toggle('hidden', capsules.length > 0);
  capsules.forEach(c => {
    const open = isUnlocked(c);
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<h3>${escapeHtml(c.title)}</h3>
      <span class="badge ${open?'open':'lock'}">${open?'✅ 已开启':'🔒 密封中'}</span>
      <div class="muted" style="margin-top:10px">封存：${c.created_at}<br>
      ${open ? '开启时间已到' : '开启：' + c.unlock_at + '<br>剩余 ' + countdownText(c)}<br>
      共 ${c.entries.length} 条记忆</div>`;
    el.onclick = () => openCapsule(c);
    box.appendChild(el);
  });
}

function openCapsule(c){
  current = c; unlockedShown = false;
  $('detailTitle').textContent = c.title;
  $('detailMeta').textContent = `封存于 ${c.created_at} · 开启于 ${c.unlock_at} · 共 ${c.entries.length} 条记忆`;
  if (isUnlocked(c)){ unlockedShown = true; renderUnlocked(); celebrate(false); }
  else renderLocked();
  renderList(); show('Detail');
}

/* ---------------- 详情 ---------------- */
function renderLocked(){
  $('detailStatus').className = 'status lock';
  $('detailStatus').textContent = '🔒 密封中 —— 可继续添加，但无法查看内容';
  $('lockedOverlay').classList.remove('hidden');
  $('lockedTitle').textContent = `共 ${current.entries.length} 条记忆正在等待开启`;
  $('countdown').textContent = countdownText(current);
  $('contentArea').innerHTML = '';
}
async function renderUnlocked(){
  $('detailStatus').className = 'status open';
  $('detailStatus').textContent = '✅ 已自动开启 —— 以下是你交给时间的记忆';
  $('lockedOverlay').classList.add('hidden');
  try {
    const key = await importKey(current.key);
    let html = '';
    for (let i = 0; i < current.entries.length; i++){
      const e = current.entries[i];
      const text = await decryptText(key, e, metaString(current));
      html += `<div class="entry"><div class="when">【${i+1}】${e.time}</div>${escapeHtml(text)}</div>`;
    }
    $('contentArea').innerHTML = html || '<div class="empty">这个胶囊里还没有内容</div>';
  } catch(err){
    $('contentArea').innerHTML = '<div class="empty">内容校验失败：胶囊文件可能已被修改</div>';
  }
}

function celebrate(showToast){
  const box = document.createElement('div'); box.className = 'confetti';
  for (let i = 0; i < 36; i++){
    const s = document.createElement('span');
    s.textContent = ['🎉','✨','⏳','🌟'][i % 4];
    s.style.left = Math.random()*100 + 'vw';
    s.style.animationDelay = Math.random()*0.6 + 's';
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3600);
  if (showToast) toast('⏰ 时间到！胶囊已自动开启');
}

$('addBtn').onclick = async () => {
  if (!current){ toast('请先打开一个胶囊'); return; }
  const text = $('addText').value.trim();
  if (!text) return;
  try {
    const key = await importKey(current.key);
    current.entries.push(await encryptText(key, text, metaString(current)));
    persist(); $('addText').value = '';
    $('detailMeta').textContent = `封存于 ${current.created_at} · 开启于 ${current.unlock_at} · 共 ${current.entries.length} 条记忆`;
    if (isUnlocked(current)) await renderUnlocked(); else renderLocked();
    toast('已封存，开启前无法查看');
    renderList();
  } catch(e){ toast('封存失败：' + e.message); }
};
$('addText').addEventListener('keydown', e => { if (e.key === 'Enter') $('addBtn').click(); });

/* ---------------- 导入导出 / 删除 ---------------- */
$('exportBtn').onclick = () => {
  if (!current) return;
  const blob = new Blob([JSON.stringify(current, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = current.title.replace(/[\\/:*?"<>|]/g,'_') + '.capsule';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast('胶囊文件已导出');
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const c = JSON.parse(await file.text());
    if (c.format !== 'TimeCapsule/1' || !c.key || !Array.isArray(c.entries)) throw new Error('文件格式不正确');
    c.id = c.id || uid();
    capsules.push(c); persist(); toast('胶囊导入成功'); openCapsule(c);
  } catch(err){ toast('导入失败：' + err.message); }
  e.target.value = '';
};
$('deleteBtn').onclick = () => {
  if (!current) return;
  if (!confirm('确定删除这个胶囊吗？删除后无法恢复。')) return;
  capsules = capsules.filter(c => c.id !== current.id);
  persist(); current = null; renderList(); show('List'); toast('胶囊已删除');
};

/* ---------------- 每秒检查：到时自动开启 ---------------- */
setInterval(() => {
  if (!current) return;
  const open = isUnlocked(current);
  if (open && !unlockedShown){ unlockedShown = true; renderUnlocked(); celebrate(true); renderList(); }
  else if (!open && !unlockedShown) $('countdown').textContent = countdownText(current);
}, 1000);

/* ---------------- 初始化 ---------------- */
if (!window.crypto || !crypto.subtle){
  document.querySelector('.layout').innerHTML =
    '<div class="card"><h2>浏览器环境不支持加密功能</h2><p>请使用较新的 Chrome / Edge / Firefox 打开本程序。</p></div>';
}
setPreset(d => d.setDate(d.getDate() + 1));
renderList();
</script>
</body>
</html>
